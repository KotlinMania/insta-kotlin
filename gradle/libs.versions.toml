[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
clap = "0.1.1"
globset = "0.1.2"
onceCell = "0.1.1"
prettyAssertions = "0.1.0"
regex = "0.1.0"
serde = "0.1.10"
supportsColor = "0.1.1"
tempfile = "0.1.0"
androidKmp = "9.4.1"
vanniktech = "0.37.0"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
clap-kotlin = { module = "io.github.kotlinmania:clap-kotlin", version.ref = "clap" }
globset-kotlin = { module = "io.github.kotlinmania:globset-kotlin", version.ref = "globset" }
once-cell-kotlin = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
pretty-assertions-kotlin = { module = "io.github.kotlinmania:pretty-assertions-kotlin", version.ref = "prettyAssertions" }
regex-kotlin = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
supports-color-kotlin = { module = "io.github.kotlinmania:supports-color-kotlin", version.ref = "supportsColor" }
tempfile-kotlin = { module = "io.github.kotlinmania:tempfile-kotlin", version.ref = "tempfile" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }

[bundles]
insta-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "clap-kotlin",
  "globset-kotlin",
  "once-cell-kotlin",
  "regex-kotlin",
  "serde-kotlin",
  "supports-color-kotlin",
  "tempfile-kotlin",
]
insta-commonTest = [
  "pretty-assertions-kotlin",
]

